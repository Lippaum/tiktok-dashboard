name: Testes

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar suíte de testes
        run: npm test

name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "collector/**"
      - "config/**"
      - "data/videos.json"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restaurar cache de capas
        uses: actions/cache/restore@v4
        with:
          path: .cover-cache
          key: cover-cache-v1-readonly
          restore-keys: |
            cover-cache-v1-

      - name: Montar o site
        run: node scripts/assemble-site.js --cover-cache .cover-cache

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
